// ─────────────────────────────────────────────
// SOURCES PAGE
// ─────────────────────────────────────────────
class SourcesPage extends StatefulWidget {
  final List<Channel> channels;
  final Function(List<Channel>) onChannelsUpdated;

  const SourcesPage({super.key, required this.channels, required this.onChannelsUpdated});

  @override
  State<SourcesPage> createState() => _SourcesPageState();
}

class _SourcesPageState extends State<SourcesPage> {
  final _urlCtrl = TextEditingController();
  bool _importing = false;
  String _status = '';

  @override
  void dispose() {
    _urlCtrl.dispose();
    super.dispose();
  }

  Future<void> _import() async {
    final url = _urlCtrl.text.trim();
    if (url.isEmpty) return;
    setState(() {
      _importing = true;
      _status = AppLocalizations.of(context).downloading;
    });
    try {
      final res = await http.get(Uri.parse(url)).timeout(const Duration(seconds: 30));
      if (res.statusCode != 200) throw Exception('HTTP ${res.statusCode}');
      setState(() => _status = AppLocalizations.of(context).parsing);
      final list = <Channel>[];
      await for (final ch in M3uService.parseM3uContent(res.body)) {
        list.add(ch);
      }
      final existing = widget.channels.map((c) => c.url).toSet();
      final newOnes = list.where((c) => !existing.contains(c.url)).toList();
      final all = [...widget.channels, ...newOnes];
      widget.onChannelsUpdated(all);
      setState(() {
        _importing = false;
        _status = '${AppLocalizations.of(context).importSuccess} ${newOnes.length} ${AppLocalizations.of(context).newChannels}';
        _urlCtrl.clear();
      });
