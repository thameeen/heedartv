import 'dart:async';
import 'package:uuid/uuid.dart';
import '../models/channel.dart';

class M3uService {
  static const _uuid = Uuid();

  /// Parses M3U / M3U8 content and yields Channel objects progressively.
  static Stream<Channel> parseM3uContent(String content) async* {
    final lines = content.split(RegExp(r'\r?\n'));
    String? currentName;
    String? currentLogo;
    String? currentGroup;

    for (int i = 0; i < lines.length; i++) {
      final line = lines[i].trim();

      if (line.startsWith('#EXTINF:')) {
        // Example: #EXTINF:-1 tvg-logo="..." group-title="News",Channel Name
        currentName = null;
        currentLogo = '';
        currentGroup = 'عام';

        // Extract attributes
        final logoMatch = RegExp(r'tvg-logo="([^"]*)"', caseSensitive: false).firstMatch(line);
        if (logoMatch != null) currentLogo = logoMatch.group(1) ?? '';

        final groupMatch = RegExp(r'group-title="([^"]*)"', caseSensitive: false).firstMatch(line);
        if (groupMatch != null) {
          final g = groupMatch.group(1)?.trim();
          if (g != null && g.isNotEmpty) currentGroup = g;
        }

        // Name is after the last comma
        final commaIndex = line.lastIndexOf(',');
        if (commaIndex != -1 && commaIndex < line.length - 1) {
          currentName = line.substring(commaIndex + 1).trim();
        }
      } else if (line.isNotEmpty &&
          !line.startsWith('#') &&
          currentName != null &&
          currentName.isNotEmpty) {
        // This is the URL line
        final url = line;
        if (_isValidStreamUrl(url)) {
          yield Channel(
            id: _uuid.v4(),
            name: currentName,
            url: url,
            logo: currentLogo ?? '',
            group: currentGroup ?? 'عام',
          );
        }
        currentName = null;
        currentLogo = null;
        currentGroup = null;
      }

      // Yield control occasionally for large playlists
      if (i % 50 == 0) {
        await Future.delayed(Duration.zero);
      }
    }
  }

  static bool _isValidStreamUrl(String url) {
    final lower = url.toLowerCase();
    return lower.startsWith('http://') ||
        lower.startsWith('https://') ||
        lower.startsWith('rtmp://') ||
        lower.startsWith('rtsp://');
  }

  /// Quick validation of a stream URL (HEAD / short timeout).
  /// Returns true if the server responds positively.
  static Future<bool> validateStreamUrl(String url, {Duration timeout = const Duration(seconds: 8)}) async {
    try {
      // We only do a lightweight check; full playback test happens in the player.
      final uri = Uri.tryParse(url);
      if (uri == null || !uri.hasScheme) return false;
      return true; // Actual test is done when playing
    } catch (_) {
      return false;
    }
  }
}


