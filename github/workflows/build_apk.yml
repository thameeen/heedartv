// ─────────────────────────────────────────────
// LIVE TV PAGE
// ─────────────────────────────────────────────
class LiveTVPage extends StatefulWidget {
  final List<Channel> channels;
  final Function(List<Channel>) onChannelsUpdated;

  const LiveTVPage({super.key, required this.channels, required this.onChannelsUpdated});

  @override
  State<LiveTVPage> createState() => _LiveTVPageState();
}

class _LiveTVPageState extends State<LiveTVPage> {
  Channel? _selected;
  VideoPlayerController? _controller;
  bool _loading = false;
  String _error = '';
  String _search = '';
  String _category = '__all__';
  bool _fullScreen = false;

  List<String> get _categories {
    final groups = widget.channels.map((c) => c.group).toSet().toList()..sort();
    return ['__all__', '__fav__', ...groups];
  }

  String _catLabel(String cat) {
    final l10n = AppLocalizations.of(context);
    if (cat == '__all__') return l10n.all;
    if (cat == '__fav__') return l10n.favorites;
    return cat;
  }

  List<Channel> get _filtered {
    var list = widget.channels;
    if (_category == '__fav__') list = list.where((c) => c.isFavorite).toList();
    else if (_category != '__all__' && _category.isNotEmpty) list = list.where((c) => c.group == _category).toList();
    if (_search.isNotEmpty) {
      final q = _search.toLowerCase();
      list = list.where((c) => c.name.toLowerCase().contains(q)).toList();
    }
    return list;
  }

  @override
  void dispose() {
    _controller?.dispose();
    super.dispose();
  }

  Future<void> _play(Channel ch) async {
    setState(() {
      _selected = ch;
      _loading = true;
      _error = '';
    });
    await _controller?.dispose();
    _controller = null;
    try {
      final c = VideoPlayerController.networkUrl(Uri.parse(ch.url));
      await c.initialize().timeout(const Duration(seconds: 15));
      await c.play();
      c.setLooping(true);
      if (mounted) {
        setState(() {
          _controller = c;
          _loading = false;
          ch.isWorking = true;
        });
      }
    } catch (e) {
      if (mounted) {
        setState(() {
          _loading = false;
          _error = AppLocalizations.of(context).playbackError;
          ch.isWorking = false;
        });
        widget.onChannelsUpdated(List.from(widget.channels));
      }
    }
  }

  @override
  Widget build(BuildContext context) {
    if (_fullScreen) return _buildFullScreen();

    final isWide = MediaQuery.of(context).size.width > 800;

    return Column(
      children: [
        // Top bar
        Container(
          padding: const EdgeInsets.fromLTRB(20, 16, 20, 12),
          child: Row(
            children: [
              Text(AppLocalizations.of(context).liveTV, style: GoogleFonts.cairo(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
              const Spacer(),
              if (_selected != null)
                Container(
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                  decoration: BoxDecoration(color: Colors.red.shade700, borderRadius: BorderRadius.circular(6)),
                  child: const Text(AppLocalizations.of(context).liveBadge, style: TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.bold)),
                ),
            ],
          ),
        ),
        Expanded(
          child: isWide
              ? Row(
                  children: [
                    // Channel list
                    SizedBox(width: 340, child: _buildChannelPanel()),
                    // Player
                    Expanded(child: _buildPlayerArea()),
                  ],
                )
              : Column(
                  children: [
                    Expanded(flex: 5, child: _buildPlayerArea()),
                    Expanded(flex: 5, child: _buildChannelPanel()),
                  ],
                ),
        ),
      ],
    );
  }

  Widget _buildChannelPanel() {
    return Container(
      color: const Color(0xFF0E1116),
      child: Column(
        children: [
          // Search
          Padding(
            padding: const EdgeInsets.fromLTRB(12, 8, 12, 4),
            child: TextField(
              style: const TextStyle(color: Colors.white, fontSize: 14),
              decoration: InputDecoration(
                hintText: AppLocalizations.of(context).searchChannel,
                hintStyle: const TextStyle(color: Colors.white30),
                prefixIcon: const Icon(Icons.search, color: Colors.white38, size: 20),
                filled: true,
                fillColor: const Color(0xFF1A1F28),
                border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                contentPadding: const EdgeInsets.symmetric(vertical: 0),
              ),
              onChanged: (v) => setState(() => _search = v),
            ),
          ),
          // Categories
          SizedBox(
            height: 42,
            child: ListView.builder(
              scrollDirection: Axis.horizontal,
              padding: const EdgeInsets.symmetric(horizontal: 8),
              itemCount: _categories.length,
              itemBuilder: (ctx, i) {
                final cat = _categories[i];
                final sel = _category == cat;
                return Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 6),
                  child: GestureDetector(
                    onTap: () => setState(() => _category = cat),
                    child: Container(
                      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 4),
                      decoration: BoxDecoration(
                        color: sel ? const Color(0xFFD4A84B) : const Color(0xFF1A1F28),
                        borderRadius: BorderRadius.circular(20),
                      ),
                      child: Text(
                        _catLabel(cat),
                        style: TextStyle(
                          color: sel ? Colors.black : Colors.white70,
                          fontSize: 12,
                          fontWeight: sel ? FontWeight.bold : FontWeight.normal,
                        ),
                      ),
                    ),
                  ),
                );
              },
            ),
          ),
          // List
          Expanded(
            child: _filtered.isEmpty
                ? Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.tv_off, size: 48, color: Colors.white24),
                        const SizedBox(height: 12),
                        Text(
                          widget.channels.isEmpty ? AppLocalizations.of(context).noChannels : AppLocalizations.of(context).noResults,
                          style: const TextStyle(color: Colors.white38),
                        ),
                        if (widget.channels.isEmpty) ...[
                          const SizedBox(height: 16),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFFD4A84B),
                              foregroundColor: Colors.black,
                            ),
                            onPressed: () => _showImport(),
                            icon: const Icon(Icons.add_link, size: 18),
                            label: Text(AppLocalizations.of(context).importM3U),
                          ),
                        ],
                      ],
                    ),
                  )
                : ListView.builder(
                    itemCount: _filtered.length,
                    padding: const EdgeInsets.only(bottom: 20),
                    itemBuilder: (ctx, i) {
                      final ch = _filtered[i];
                      final sel = _selected?.id == ch.id;
                      return Focus(
                        onKeyEvent: (n, e) {
                          if (e is KeyDownEvent &&
                              (e.logicalKey == LogicalKeyboardKey.select || e.logicalKey == LogicalKeyboardKey.enter)) {
                            _play(ch);
                            return KeyEventResult.handled;
                          }
                          return KeyEventResult.ignored;
                        },
                        child: Builder(builder: (c) {
                          final focused = Focus.of(c).hasFocus;
                          return Container(
                            margin: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                            decoration: BoxDecoration(
                              color: focused
                                  ? const Color(0xFFD4A84B).withOpacity(0.2)
                                  : sel
                                      ? const Color(0xFF1A1F28)
                                      : Colors.transparent,
                              borderRadius: BorderRadius.circular(10),
                              border: focused ? Border.all(color: const Color(0xFFD4A84B), width: 1.5) : null,
                            ),
                            child: ListTile(
                              dense: true,
                              leading: CircleAvatar(
                                radius: 18,
                                backgroundColor: const Color(0xFF1A1F28),
                                backgroundImage: ch.logo.isNotEmpty ? CachedNetworkImageProvider(ch.logo) : null,
                                child: ch.logo.isEmpty ? const Icon(Icons.live_tv, size: 16, color: Colors.white54) : null,
                              ),
                              title: Text(
                                ch.name,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  color: sel ? const Color(0xFFD4A84B) : Colors.white,
                                  fontSize: 13.5,
                                  fontWeight: sel ? FontWeight.bold : FontWeight.normal,
                                ),
                              ),
                              subtitle: Text(ch.group, style: const TextStyle(color: Colors.white38, fontSize: 11)),
                              trailing: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  if (!ch.isWorking) const Icon(Icons.error_outline, color: Colors.redAccent, size: 16),
                                  IconButton(
                                    icon: Icon(
                                      ch.isFavorite ? Icons.favorite : Icons.favorite_border,
                                      size: 18,
                                      color: ch.isFavorite ? Colors.redAccent : Colors.white30,
                                    ),
                                    onPressed: () {
                                      setState(() => ch.isFavorite = !ch.isFavorite);
                                      widget.onChannelsUpdated(List.from(widget.channels));
                                    },
                                  ),
                                ],
                              ),
                              onTap: () => _play(ch),
                            ),
                          );
                        }),
                      );
                    },
                  ),
          ),
        ],
      ),
    );
  }

  Widget _buildPlayerArea() {
    return Container(
      color: Colors.black,
      child: Column(
        children: [
          Expanded(
            flex: 6,
            child: Stack(
              alignment: Alignment.center,
              children: [
                if (_controller != null && _controller!.value.isInitialized)
                  AspectRatio(
                    aspectRatio: _controller!.value.aspectRatio,
                    child: VideoPlayer(_controller!),
                  )
                else if (_loading)
                  const Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      CircularProgressIndicator(color: Color(0xFFD4A84B)),
                      SizedBox(height: 16),
                      Text(AppLocalizations.of(context).connecting, style: TextStyle(color: Colors.white70)),
                    ],
                  )
                else if (_error.isNotEmpty)
                  Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.signal_wifi_connected_no_internet_4, size: 52, color: Colors.redAccent),
                      const SizedBox(height: 12),
                      Text(_error, style: const TextStyle(color: Colors.white70)),
                      if (_selected != null)
                        TextButton(
                          onPressed: () => _play(_selected!),
                          child: const Text(AppLocalizations.of(context).retry, style: TextStyle(color: Color(0xFFD4A84B))),
                        ),
                    ],
                  )
                else
                  const Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.tv, size: 64, color: Colors.white12),
                      SizedBox(height: 12),
                      Text(AppLocalizations.of(context).chooseChannel, style: TextStyle(color: Colors.white38, fontSize: 16)),
                    ],
                  ),
                if (_controller != null && _controller!.value.isInitialized)
                  Positioned(
                    bottom: 12,
                    left: 12,
                    child: IconButton(
                      icon: const Icon(Icons.fullscreen, color: Colors.white70, size: 28),
                      onPressed: () => setState(() => _fullScreen = true),
                    ),
                  ),
              ],
            ),
          ),
          // Info bar
          Container(
            width: double.infinity,
            padding: const EdgeInsets.all(16),
            color: const Color(0xFF0E1116),
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(
                  _selected?.name ?? 'Heedar TV',
                  style: GoogleFonts.cairo(color: const Color(0xFFD4A84B), fontSize: 18, fontWeight: FontWeight.bold),
                ),
                const SizedBox(height: 4),
                Text(
                  _selected != null ? 'المجموعة: ${_selected!.group}' : 'استورد قائمة للبدء',
                  style: const TextStyle(color: Colors.white54, fontSize: 13),
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildFullScreen() {
    return Stack(
      fit: StackFit.expand,
      children: [
        if (_controller != null && _controller!.value.isInitialized)
          Center(child: AspectRatio(aspectRatio: _controller!.value.aspectRatio, child: VideoPlayer(_controller!))),
        Positioned(
          top: 24,
          left: 24,
          child: IconButton(
            icon: const Icon(Icons.fullscreen_exit, color: Colors.white, size: 32),
            onPressed: () => setState(() => _fullScreen = false),
          ),
        ),
        if (_selected != null)
          Positioned(
            bottom: 32,
            left: 32,
            right: 32,
            child: Container(
              padding: const EdgeInsets.all(12),
              decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(10)),
              child: Text(_selected!.name, textAlign: TextAlign.center, style: const TextStyle(color: Color(0xFFD4A84B), fontSize: 18, fontWeight: FontWeight.bold)),
            ),
          ),
      ],
    );
  }

  void _showImport() {
    // Reuse similar dialog from before - simplified call
    final urlCtrl = TextEditingController();
    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF141820),
        title: Text(AppLocalizations.of(context).importM3U, style: const TextStyle(color: Color(0xFFD4A84B))),
        content: TextField(
          controller: urlCtrl,
          style: const TextStyle(color: Colors.white),
          decoration: const InputDecoration(hintText: 'https://...playlist.m3u', hintStyle: TextStyle(color: Colors.white30)),
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: Text(AppLocalizations.of(context).cancel)),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4A84B), foregroundColor: Colors.black),
            onPressed: () async {
              final url = urlCtrl.text.trim();
              if (url.isEmpty) return;
              Navigator.pop(ctx);
              try {
                final res = await http.get(Uri.parse(url)).timeout(const Duration(seconds: 25));
                if (res.statusCode == 200) {
                  final list = <Channel>[];
                  await for (final ch in M3uService.parseM3uContent(res.body)) {
                    list.add(ch);
                  }
                  final existing = widget.channels.map((c) => c.url).toSet();
                  final newOnes = list.where((c) => !existing.contains(c.url)).toList();
                  final all = [...widget.channels, ...newOnes];
                  widget.onChannelsUpdated(all);
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      SnackBar(content: Text('${AppLocalizations.of(context).importSuccess} ${newOnes.length} ${AppLocalizations.of(context).channels}'), backgroundColor: const Color(0xFF1A1F28)),
                    );
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text(AppLocalizations.of(context).importFailed), backgroundColor: Colors.redAccent),
                  );
                }
              }
            },
            child: Text(AppLocalizations.of(context).importM3U),
          ),
        ],
      ),
    );
  }
}

