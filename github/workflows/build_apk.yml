# Heedar TV — النسخة الفاخرة 1.1

تطبيق بث متكامل بواجهة فاخرة (فحم داكن + ذهبي) للهواتف وأجهزة Android TV.

## المميزات

- تصميم فاخر Dark & Gold
- دعم العربية والإنجليزية مع تبديل فوري وحفظ الاختيار
- RTL / LTR تلقائي حسب اللغة
- الصفحة الرئيسية بإحصائيات ووصول سريع
- بث مباشر: استيراد M3U/M3U8، تصنيفات، بحث، مفضلة، مشغل فيديو
- أقسام الأفلام والمسلسلات (جاهزة هيكليًا)
- إدارة مصادر مع حفظ محلي دائم
- دعم أساسي لجهاز التحكم (Focus)

## هيكل المشروع

```
heedar_tv/
├── lib/
│   ├── main.dart                 # الواجهة الكاملة والتنقل
│   ├── l10n/
│   │   └── app_localizations.dart  # الترجمة عربي / English
│   ├── models/
│   │   ├── channel.dart          # نموذج القناة
│   │   └── media_item.dart       # نموذج الأفلام والمسلسلات
│   └── services/
│       └── m3u_service.dart      # محلل قوائم M3U
├── android/                      # إعدادات أندرويد + دعم TV
├── pubspec.yaml
└── README.md
```

## التشغيل والبناء

```bash
flutter pub get
flutter run
```

بناء APK:

```bash
flutter build apk --release
```

الملف الناتج:
`build/app/outputs/flutter-apk/app-release.apk`

## ملاحظات

- التطبيق لا يأتي بقنوات جاهزة.
- أضف قوائم M3U من قسم المصادر.
- اللغة الافتراضية: العربية (يمكن تغييرها من الإعدادات).


