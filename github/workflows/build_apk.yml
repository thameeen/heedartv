class _HomePage extends StatelessWidget {
  final List<Channel> channels;
  final List<MediaItem> movies;
  final List<MediaItem> series;
  final Function(int) onNavigate;

  const _HomePage({
    required this.channels,
    required this.movies,
    required this.series,
    required this.onNavigate,
  });

  @override
  Widget build(BuildContext context) {
    return CustomScrollView(
      slivers: [
        // Header
        theSliverAppBar(),
        SliverToBoxAdapter(
          child: Padding(
            padding: const EdgeInsets.fromLTRB(24, 8, 24, 24),
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                // Stats cards
                _buildStatsRow(),
                const SizedBox(height: 28),
                // Quick actions
                Text(AppLocalizations.of(context).quickAccess, style: _sectionTitle()),
                const SizedBox(height: 14),
                _buildQuickActions(),
                const SizedBox(height: 32),
                // Live preview section
                Text(AppLocalizations.of(context).liveTV, style: _sectionTitle()),
                const SizedBox(height: 14),
                _buildLivePreviewCard(context),
                const SizedBox(height: 32),
                // Movies teaser
                Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Text(AppLocalizations.of(context).movies, style: _sectionTitle()),
                    TextButton(
                      onPressed: () => onNavigate(2),
                      child: Text(AppLocalizations.of(context).viewAll, style: const TextStyle(color: Color(0xFFD4A84B))),
                    ),
                  ],
                ),
                const SizedBox(height: 12),
                _buildMediaTeaser(movies, AppLocalizations.of(context).noMovies.split('\n').first, Icons.movie_creation_rounded),
                const SizedBox(height: 32),
                // Series teaser
                Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Text(AppLocalizations.of(context).series, style: _sectionTitle()),
                    TextButton(
                      onPressed: () => onNavigate(3),
                      child: Text(AppLocalizations.of(context).viewAll, style: const TextStyle(color: Color(0xFFD4A84B))),
                    ),
                  ],
                ),
                const SizedBox(height: 12),
                _buildMediaTeaser(series, AppLocalizations.of(context).noSeries.split('\n').first, Icons.tv_rounded),
                const SizedBox(height: 40),
              ],
            ),
          ),
        ),
      ],
    );
  }

  Widget theSliverAppBar() {
    return SliverAppBar(
      floating: true,
      backgroundColor: const Color(0xFF0A0C0F),
      expandedHeight: 0,
      title: Row(
        children: [
          Text(
            'Heedar TV',
            style: GoogleFonts.cairo(
              color: const Color(0xFFD4A84B),
              fontWeight: FontWeight.bold,
              fontSize: 22,
            ),
          ),
          const Spacer(),
          Container(
            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
            decoration: BoxDecoration(
              color: const Color(0xFF141820),
              borderRadius: BorderRadius.circular(20),
              border: Border.all(color: const Color(0xFFD4A84B).withOpacity(0.3)),
            ),
            child: Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                Icon(Icons.circle, size: 8, color: Colors.greenAccent.shade400),
                const SizedBox(width: 6),
                Text(
                  '${channels.length} قناة',
                  style: const TextStyle(color: Colors.white70, fontSize: 12),
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }

  TextStyle _sectionTitle() => GoogleFonts.cairo(
        color: Colors.white,
        fontSize: 18,
        fontWeight: FontWeight.bold,
      );

  Widget _buildStatsRow() {
    return Row(
      children: [
        _statCard('القنوات', '${channels.length}', Icons.live_tv_rounded, const Color(0xFFD4A84B)),
        const SizedBox(width: 12),
        _statCard('الأفلام', '${movies.length}', Icons.movie_creation_rounded, const Color(0xFF5B8DEF)),
        const SizedBox(width: 12),
        _statCard('المسلسلات', '${series.length}', Icons.tv_rounded, const Color(0xFFE85D75)),
