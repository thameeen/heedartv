class Channel {
  final String id;
  final String name;
  final String url;
  final String logo;
  final String group;
  bool isFavorite;
  bool isWorking;

  Channel({
    required this.id,
    required this.name,
    required this.url,
    this.logo = '',
    this.group = 'عام',
    this.isFavorite = false,
    this.isWorking = true,
  });

  factory Channel.fromJson(Map<String, dynamic> json) {
    return Channel(
      id: json['id'] as String? ?? '',
      name: json['name'] as String? ?? 'قناة بدون اسم',
      url: json['url'] as String? ?? '',
      logo: json['logo'] as String? ?? '',
      group: json['group'] as String? ?? 'عام',
      isFavorite: json['isFavorite'] as bool? ?? false,
      isWorking: json['isWorking'] as bool? ?? true,
    );
  }

  Map<String, dynamic> toJson() {
    return {
      'id': id,
      'name': name,
      'url': url,
      'logo': logo,
      'group': group,
      'isFavorite': isFavorite,
      'isWorking': isWorking,
    };
  }

  Channel copyWith({
    String? id,
    String? name,
    String? url,
    String? logo,
    String? group,
    bool? isFavorite,
    bool? isWorking,
  }) {
    return Channel(
      id: id ?? this.id,
      name: name ?? this.name,
      url: url ?? this.url,
      logo: logo ?? this.logo,
      group: group ?? this.group,
      isFavorite: isFavorite ?? this.isFavorite,
      isWorking: isWorking ?? this.isWorking,
    );
  }
}


