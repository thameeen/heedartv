class MainShell extends StatefulWidget {
  const MainShell({super.key});

  @override
  State<MainShell> createState() => _MainShellState();
}

class _MainShellState extends State<MainShell> {
  int _currentIndex = 0; // 0=Home, 1=Live, 2=Movies, 3=Series, 4=Sources

  List<Channel> _channels = [];
  List<MediaItem> _movies = [];
  List<MediaItem> _series = [];

  @override
  void initState() {
    super.initState();
    _loadAllData();
  }

  Future<void> _loadAllData() async {
    final prefs = await SharedPreferences.getInstance();
    try {
      final chData = prefs.getString('saved_channels');
      if (chData != null) {
        final list = jsonDecode(chData) as List;
        _channels = list.map((e) => Channel.fromJson(Map<String, dynamic>.from(e))).toList();
      }
      final movData = prefs.getString('saved_movies');
      if (movData != null) {
        final list = jsonDecode(movData) as List;
        _movies = list.map((e) => MediaItem.fromJson(Map<String, dynamic>.from(e))).toList();
      }
      final serData = prefs.getString('saved_series');
      if (serData != null) {
        final list = jsonDecode(serData) as List;
        _series = list.map((e) => MediaItem.fromJson(Map<String, dynamic>.from(e))).toList();
      }
    } catch (e) {
      debugPrint('Load error: $e');
    }
    if (mounted) setState(() {});
  }

  Future<void> _saveChannels() async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setString('saved_channels', jsonEncode(_channels.map((c) => c.toJson()).toList()));
  }

  void _onChannelsUpdated(List<Channel> channels) {
    setState(() => _channels = channels);
    _saveChannels();
  }

  @override
  Widget build(BuildContext context) {
    final isWide = MediaQuery.of(context).size.width > 700;

    final isArabic = Localizations.localeOf(context).languageCode == 'ar';
    return Directionality(
      textDirection: isArabic ? TextDirection.rtl : TextDirection.ltr,
      child: Scaffold(
        backgroundColor: const Color(0xFF0A0C0F),
        body: Row(
          children: [
            // ─── Side Navigation (Premium) ───
            _buildSideNav(isWide),
            // ─── Content ───
            Expanded(
              child: IndexedStack(
                index: _currentIndex,
                children: [
                  _HomePage(
                    channels: _channels,
                    movies: _movies,
                    series: _series,
                    onNavigate: (i) => setState(() => _currentIndex = i),
                  ),
                  LiveTVPage(
                    channels: _channels,
                    onChannelsUpdated: _onChannelsUpdated,
                  ),
                  Builder(builder: (c) {
                    final l = AppLocalizations.of(c);
                    return MediaGridPage(
                      title: l.movies,
                      items: _movies,
                      emptyMessage: l.noMovies,
                      icon: Icons.movie_creation_rounded,
                    );
                  }),
                  Builder(builder: (c) {
                    final l = AppLocalizations.of(c);
                    return MediaGridPage(
                      title: l.series,
                      items: _series,
                      emptyMessage: l.noSeries,
                      icon: Icons.tv_rounded,
                    );
                  }),
                  SourcesPage(
                    channels: _channels,
                    onChannelsUpdated: _onChannelsUpdated,
                  ),
                ],
              ),
            ),
          ],
        ),
      ),
    );
  }

  Widget _buildSideNav(bool isWide) {
    final l10n = AppLocalizations.of(context);
    final items = [
      _NavItem(Icons.home_rounded, l10n.home, 0),
      _NavItem(Icons.live_tv_rounded, l10n.live, 1),
      _NavItem(Icons.movie_creation_rounded, l10n.movies, 2),
      _NavItem(Icons.tv_rounded, l10n.series, 3),
      _NavItem(Icons.cloud_download_rounded, l10n.sources, 4),
      _NavItem(Icons.settings_rounded, l10n.settings, 5),
    ];

    return Container(
      width: isWide ? 92 : 72,
      decoration: const BoxDecoration(
        color: Color(0xFF0E1116),
        border: Border(left: BorderSide(color: Color(0xFF1A1F28), width: 1)),
      ),
      child: Column(
        children: [
          const SizedBox(height: 28),
          // Logo
          Container(
            width: 48,
            height: 48,
            decoration: BoxDecoration(
              gradient: const LinearGradient(
                colors: [Color(0xFFD4A84B), Color(0xFFB8860B)],
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
              ),
              borderRadius: BorderRadius.circular(14),
              boxShadow: [
                BoxShadow(
                  color: const Color(0xFFD4A84B).withOpacity(0.35),
                  blurRadius: 12,
                  offset: const Offset(0, 4),
                ),
              ],
            ),
            child: const Center(
              child: Text(
                'H',
                style: TextStyle(
                  color: Colors.black,
                  fontWeight: FontWeight.w900,
                  fontSize: 24,
                ),
              ),
            ),
          ),
          const SizedBox(height: 8),
          Text(
            'HEEDAR',
            style: GoogleFonts.cairo(
              color: const Color(0xFFD4A84B),
              fontSize: 11,
              fontWeight: FontWeight.bold,
              letterSpacing: 1.5,
            ),
          ),
          const SizedBox(height: 32),
          Expanded(
            child: ListView.builder(
              itemCount: items.length,
              padding: const EdgeInsets.symmetric(horizontal: 10),
              itemBuilder: (ctx, i) {
                final item = items[i];
                final selected = _currentIndex == item.index;
                return Padding(
                  padding: const EdgeInsets.only(bottom: 6),
                  child: Focus(
                    onKeyEvent: (node, event) {
                      if (event is KeyDownEvent &&
                          (event.logicalKey == LogicalKeyboardKey.select ||
                              event.logicalKey == LogicalKeyboardKey.enter)) {
                        if (item.index == 5) {
                          _showSettings();
                        } else {
                          setState(() => _currentIndex = item.index);
                        }
                        return KeyEventResult.handled;
                      }
                      return KeyEventResult.ignored;
                    },
                    child: Builder(builder: (c) {
                      final focused = Focus.of(c).hasFocus;
                      return Material(
                        color: Colors.transparent,
                        child: InkWell(
                          borderRadius: BorderRadius.circular(14),
                          onTap: () {
                            if (item.index == 5) {
                              _showSettings();
                            } else {
                              setState(() => _currentIndex = item.index);
                            }
                          },
                          child: AnimatedContainer(
                            duration: const Duration(milliseconds: 200),
                            padding: const EdgeInsets.symmetric(vertical: 12),
                            decoration: BoxDecoration(
                              color: selected
                                  ? const Color(0xFFD4A84B).withOpacity(0.15)
                                  : focused
                                      ? Colors.white.withOpacity(0.05)
                                      : Colors.transparent,
                              borderRadius: BorderRadius.circular(14),
                              border: focused || selected
                                  ? Border.all(
                                      color: const Color(0xFFD4A84B).withOpacity(selected ? 0.6 : 0.4),
                                      width: 1.5,
                                    )
                                  : null,
                            ),
                            child: Column(
                              children: [
                                Icon(
                                  item.icon,
                                  size: 24,
                                  color: selected || focused
                                      ? const Color(0xFFD4A84B)
                                      : Colors.white54,
                                ),
                                const SizedBox(height: 4),
                                Text(
                                  item.label,
                                  style: TextStyle(
                                    fontSize: 10,
                                    color: selected || focused
                                        ? const Color(0xFFD4A84B)
                                        : Colors.white38,
                                    fontWeight: selected ? FontWeight.bold : FontWeight.normal,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      );
                    }),
                  ),
                );
              },
            ),
          ),
          Padding(
            padding: const EdgeInsets.only(bottom: 20),
            child: Text(
              'v1.1',
              style: TextStyle(color: Colors.white.withOpacity(0.2), fontSize: 10),
            ),
          ),
        ],
      ),
    );
  }

  void _showSettings() {
    final l10n = AppLocalizations.of(context);
    final isArabic = Localizations.localeOf(context).languageCode == 'ar';
    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF141820),
        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
        title: Text(l10n.settings, style: TextStyle(color: const Color(0xFFD4A84B), fontWeight: FontWeight.bold, fontFamily: isArabic ? 'Cairo' : null)),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            // Language switcher
            ListTile(
              leading: const Icon(Icons.language, color: Color(0xFFD4A84B)),
              title: Text(l10n.language, style: const TextStyle(color: Colors.white)),
              subtitle: Text(isArabic ? l10n.arabic : l10n.english, style: const TextStyle(color: Colors.white54, fontSize: 12)),
              trailing: Row(
                mainAxisSize: MainAxisSize.min,
                children: [
                  _langBtn(ctx, 'AR', isArabic, () {
                    HeedarTVApp.of(context)?.setLocale(const Locale('ar', 'AE'));
                    Navigator.pop(ctx);
                  }),
                  const SizedBox(width: 6),
                  _langBtn(ctx, 'EN', !isArabic, () {
                    HeedarTVApp.of(context)?.setLocale(const Locale('en', 'US'));
                    Navigator.pop(ctx);
                  }),
                ],
              ),
            ),
            const Divider(color: Colors.white12),
            ListTile(
              leading: const Icon(Icons.delete_outline, color: Colors.redAccent),
              title: Text(l10n.clearChannels, style: const TextStyle(color: Colors.white)),
              onTap: () async {
                final prefs = await SharedPreferences.getInstance();
                await prefs.remove('saved_channels');
                setState(() => _channels = []);
                if (ctx.mounted) Navigator.pop(ctx);
              },
            ),
            const Divider(color: Colors.white12),
            ListTile(
              leading: const Icon(Icons.info_outline, color: Color(0xFFD4A84B)),
              title: const Text('Heedar TV', style: TextStyle(color: Colors.white)),
              subtitle: Text(l10n.version, style: const TextStyle(color: Colors.white54, fontSize: 12)),
            ),
          ],
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(ctx),
            child: Text(l10n.close, style: const TextStyle(color: Color(0xFFD4A84B))),
          ),
        ],
      ),
    );
  }

  Widget _langBtn(BuildContext ctx, String label, bool selected, VoidCallback onTap) {
    return GestureDetector(
      onTap: onTap,
      child: Container(
        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
        decoration: BoxDecoration(
          color: selected ? const Color(0xFFD4A84B) : const Color(0xFF1A1F28),
          borderRadius: BorderRadius.circular(8),
        ),
        child: Text(
          label,
          style: TextStyle(
            color: selected ? Colors.black : Colors.white70,
            fontWeight: FontWeight.bold,
            fontSize: 13,
          ),
        ),
      ),
    );
  }
}

class _NavItem {
  final IconData icon;
  final String label;
  final int index;
  _NavItem(this.icon, this.label, this.index);
}

